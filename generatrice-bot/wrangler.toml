# Remplace l'ancien bot ChatGPT : même nom de Worker, donc mêmes secrets Meta,
# HubSpot, registre et Resend déjà installés sur Cloudflare.
name = "solution-nrj-messenger"
main = "src/index.ts"
account_id = "d54137d1bad690d828265766d3f36566"
compatibility_date = "2026-10-09"
compatibility_flags = ["nodejs_compat"]
workers_dev = true

[vars]
CLAUDE_MODEL = "claude-opus-5-5"
META_PAGE_ID = "108271818899977"
# Interrupteur général : "true" pour que le bot réponde.
MESSENGER_ENABLED = "true"
# Phase de test : "true" = le bot ne répond qu'à Frederic (secret MESSENGER_OWNER_TEST_PSID).
# Passer à "false" pour ouvrir le bot aux nouveaux clients.
MESSENGER_OWNER_ONLY = "false"
# Nouveaux clients seulement (liste MESSENGER_EXISTING_BASELINE + MESSENGER_ACTIVATED_AT, secrets).
MESSENGER_NEW_ONLY = "true"
# Pause du bot quand un humain prend la conversation.
HUMAN_PAUSE_HOURS = "24"
# Soumissions : registre des numéros, HubSpot, courriel Resend.
QUOTE_REGISTER_URL = "https://solution-nrj-soumissions.monscorbu.workers.dev"
QUOTE_WRITES_ENABLED = "true"
HUBSPOT_WRITES_ENABLED = "true"
QUOTATION_EMAIL_ENABLED = "true"

# Appels vers l'application des soumissions (numéros S-AAAA-NNNN) : liaison directe,
# car Cloudflare bloque un fetch public entre Workers du même domaine (erreur 1042).
[[services]]
binding = "QUOTE_REGISTER"
service = "solution-nrj-soumissions"

# Journaux consultables dans le tableau de bord Cloudflare (Workers → Logs).
[observability]
enabled = true

# Mémoire des conversations du nouveau bot.
[[kv_namespaces]]
binding = "BOT_STATE"
id = "ecf9cef5e0a14f4cbe57b636398bbcb0"

# Durable Objects de l'ancien bot : conservés tels quels (voir src/index.ts).
[[durable_objects.bindings]]
name = "CONVERSATIONS"
class_name = "Conversation"

[[durable_objects.bindings]]
name = "MAIL_GATE"
class_name = "MailGate"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["Conversation"]

[[migrations]]
tag = "v2"
new_sqlite_classes = ["MailGate"]

# Secrets (jamais dans ce fichier), déjà présents sur l'ancien Worker sauf indication :
#   META_APP_SECRET, META_PAGE_ACCESS_TOKEN, META_VERIFY_TOKEN, ADMIN_TOKEN,
#   RESEND_API_KEY, HUBSPOT_ACCESS_TOKEN, QUOTE_REGISTER_PASSWORD,
#   MESSENGER_EXISTING_BASELINE, MESSENGER_ACTIVATED_AT, MESSENGER_OWNER_TEST_PSID
# Nouveau :  npx wrangler secret put ANTHROPIC_API_KEY
# À retirer : npx wrangler secret delete OPENAI_API_KEY
